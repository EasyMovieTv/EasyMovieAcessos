<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Movies - Acesso ao Conteúdo</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body {
            background-color: #050505;
            background: linear-gradient(135deg, #050505 0%, #1a0000 50%, #050505 100%);
            background-size: 400% 400%;
            animation: gradientLoop 10s ease infinite;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            overflow: hidden;
        }

        @keyframes gradientLoop {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #introScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            background-image: 
                linear-gradient(rgba(0, 255, 100, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 100, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            transition: opacity 1s ease;
            text-align: center;
            padding: 20px;
        }

        .scanner-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(0, 255, 100, 0.25);
            box-shadow: 0 0 10px rgba(0, 255, 100, 0.4);
            z-index: 10;
            animation: scan 4s linear infinite;
            pointer-events: none;
        }

        @keyframes scan {
            0% { top: 0%; }
            50% { top: 100%; }
            100% { top: 0%; }
        }

        .intro-title {
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-family: 'Arial Black', Gadget, sans-serif;
            margin-bottom: 15px;
            text-shadow: 0 0 20px rgba(255, 51, 51, 0.8);
            animation: pulseText 2s infinite alternate;
            z-index: 11;
        }

        @keyframes pulseText {
            from { transform: scale(1); opacity: 0.8; }
            to { transform: scale(1.05); opacity: 1; }
        }

        .intro-sub {
            color: #00ff64;
            font-size: 14px;
            margin-bottom: 35px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-family: monospace;
            z-index: 11;
            opacity: 0.9;
        }

        .btn-netflix {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 260px;
            padding: 16px 24px;
            background-color: #E50914;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 14px rgba(229, 9, 20, 0.4);
            outline: none;
            z-index: 11;
        }

        .btn-netflix:hover {
            background-color: #f40612;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(229, 9, 20, 0.6);
        }

        .container {
            background: rgba(15, 15, 15, 0.85);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(255, 0, 0, 0.2);
            border: 1px solid rgba(255, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
            backdrop-filter: blur(10px);
            display: none; 
            animation: fadeInApp 1s ease;
        }

        @keyframes fadeInApp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-container {
            margin-bottom: 30px;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-family: 'Arial Black', Gadget, sans-serif;
            text-shadow: 0 0 10px rgba(255, 51, 51, 0.8);
        }

        .logo-easy { color: #ffffff; }
        .logo-movie { color: #ff3333; }

        h2 {
            margin-bottom: 24px;
            font-size: 20px;
            color: #ff3333;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #ccc;
        }

        input {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            font-size: 16px;
            transition: all 0.3s;
            -webkit-user-select: text;
            user-select: text;
        }

        input:focus {
            border-color: #ff3333;
            outline: none;
            box-shadow: 0 0 8px rgba(255, 51, 51, 0.4);
        }

        button {
            width: 100%;
            padding: 12px;
            background: #cc0000;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }

        button:hover { background: #ff1a1a; }
        button:active { transform: scale(0.98); }

        .error-msg {
            color: #ff4d4d;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }

        .loading-steps {
            margin-top: 15px;
            font-family: monospace;
            font-size: 13px;
            color: #ffcc00;
            display: none;
            text-align: center;
            letter-spacing: 1px;
        }

        .selection-screen {
            display: none;
            text-align: center;
        }

        .selection-screen h3 {
            margin-bottom: 20px;
            color: #fff;
            font-size: 20px;
        }

        .btn-plan {
            display: block;
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            background: #1a1a1a;
            border: 1px solid #ff3333;
            color: white;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn-plan:hover {
            background: #ff3333;
            color: white;
        }

        .btn-sales {
            background: #00ff64 !important;
            border-color: #00ff64 !important;
            color: #000 !important;
            margin-top: 15px;
            display: none;
            text-transform: uppercase;
        }

        .btn-sales:hover {
            background: #00cc52 !important;
            color: #000 !important;
        }

        .btn-logout {
            background: transparent !important;
            border: 1px solid #444 !important;
            color: #aaa !important;
            margin-top: 15px;
            padding: 10px !important;
            font-size: 14px !important;
        }

        .btn-logout:hover {
            background: rgba(255, 255, 255, 0.05) !important;
            color: #fff !important;
            border-color: #666 !important;
        }
    </style>
</head>
<body>

    <audio id="audioVinheta" src="vinheta.mp3" preload="auto"></audio>

    <div id="introScreen">
        <div class="scanner-bar"></div>
        <div class="intro-title">
            <span style="color:#fff;">EASY</span><span style="color:#ff3333;">MOVIES</span>
        </div>
        <p class="intro-sub">[ AUTENTICANDO CONEXÃO ]</p>
        
        <div style="display: flex; justify-content: center; width: 100%;">
            <button class="btn-netflix" onclick="iniciarExperiencia()">
                <span>▶</span> ACESSAR PLATAFORMA
            </button>
        </div>
    </div>

    <div class="container" id="mainContainer">
        <div id="loginSection">
            <div class="logo-container">
                <span class="logo-easy">EASY</span><span class="logo-movie">MOVIE</span>
            </div>
            
            <h2>ÁREA DE ACESSO</h2>
            
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label>E-mail de Acesso</label>
                    <input type="text" id="email" required placeholder="seu@email.com">
                </div>
                <div class="input-group">
                    <label>Senha</label>
                    <input type="password" id="password" required placeholder="Sua senha">
                </div>
                <button type="submit" id="submitBtn">Entrar</button>
                <div id="errorMsg" class="error-msg">E-mail ou senha incorretos.</div>
                <a href="https://easymovietv.github.io/easymovies/" id="salesBtn" class="btn-plan btn-sales" target="_blank">Garanta seu Acesso</a>
                <div id="loadingSteps" class="loading-steps">[ Estabelecendo conexão segura... ]</div>
            </form>
        </div>

        <div id="selectionSection" class="selection-screen">
             <div class="logo-container">
                <span class="logo-easy">EASY</span><span class="logo-movie">MOVIE</span>
            </div>
            <h3>Selecione a sua rede de acesso:</h3>
            <a href="redes1.html" id="linkRede1" class="btn-plan" target="_blank" style="display: none;">Rede 1</a>
<a href="redes2.html" id="linkRede2" class="btn-plan" target="_blank" style="display: none;">Rede 2</a>
            <button class="btn-plan btn-logout" onclick="fazerLogout()">Sair da Conta</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12') {
                e.preventDefault();
            }
            if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) {
                e.preventDefault();
            }
            if (e.ctrlKey && (e.key === 'U' || e.key === 'u')) {
                e.preventDefault();
            }
        });

        const firebaseConfig = {
            apiKey: "AIzaSyDFyac7Za3KI0T6CD6NS_Ak2StTMJbCzf0",
            authDomain: "easymovie-e0bea.firebaseapp.com",
            projectId: "easymovie-e0bea",
            storageBucket: "easymovie-e0bea.firebasestorage.app",
            messagingSenderId: "100437930301",
            appId: "1:100437930301:web:f7e4eb48868795a07e5554"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let heartbeatInterval = null;

        function iniciarExperiencia() {
            const audio = document.getElementById('audioVinheta');
            audio.play().catch(error => {
                console.log("Áudio bloqueado:", error);
            });

            const intro = document.getElementById('introScreen');
            intro.style.opacity = '0';
            
            setTimeout(() => {
                intro.style.display = 'none';
                document.getElementById('mainContainer').style.display = 'block';
            }, 800);
        }

        const LINKS_REDES = {
            "rede1": "redes1.html",
            "rede2": "redes2.html"
        };

async function handleLogin(event) {
    event.preventDefault();

    const email = document.getElementById('email').value.trim();
    const senha = document.getElementById('password').value.trim();
    
    const submitBtn = document.getElementById('submitBtn');
    const errorMsg = document.getElementById('errorMsg');
    const loadingSteps = document.getElementById('loadingSteps');

    if (errorMsg) errorMsg.style.display = 'none';

    // Prepara a tela para o carregamento
    submitBtn.disabled = true;
    submitBtn.style.opacity = '0.5';
    loadingSteps.style.display = 'block';
    loadingSteps.style.color = '#ffd700'; // Amarelo forte

    let autenticadoComSucesso = false;
    let usuarioUid = "";

    // 1. Tenta autenticar em segundo plano
    try {
        const userCredential = await firebase.auth().signInWithEmailAndPassword(email, senha);
        usuarioUid = userCredential.user.uid;
        autenticadoComSucesso = true;
    } catch (error) {
        autenticadoComSucesso = false;
    }

    // 2. O show de 15 segundos de segurança em AMARELO
    const mensagens = [
        "[ Estabelecendo conexão segura... ]",
        "[ Verificando integridade da sessão... ]",
        "[ Analisando barreiras anti-fraude... ]",
        "[ Consultando banco de dados criptografado... ]",
        "[ Validando credenciais de acesso... ]"
    ];

    for (let i = 0; i < mensagens.length; i++) {
        loadingSteps.innerHTML = mensagens[i];
        await new Promise(resolve => setTimeout(resolve, 3000)); // 15 segundos total
    }

    // 3. Se errou a senha/e-mail
    if (!autenticadoComSucesso) {
        submitBtn.disabled = false;
        submitBtn.style.opacity = '1';
        loadingSteps.style.color = '#ff3333';
        loadingSteps.innerHTML = "[ ❌ ACESSO NEGADO ]";
        return;
    }

    // 4. Verificação de Concorrência (Bloqueia se já estiver logado em outro lugar)
    try {
        const sessaoRef = db.collection("sessoes_ativas").doc(usuarioUid);
        const sessaoDoc = await sessaoRef.get();

        if (sessaoDoc.exists) {
            // Se já tem sessão ativa, derruba a tentativa de login duplo
            await firebase.auth().signOut();
            submitBtn.disabled = false;
            submitBtn.style.opacity = '1';
            loadingSteps.style.color = '#ff3333';
            loadingSteps.innerHTML = "[ ❌ CONTA JÁ EM USO EM OUTRO DISPOSITIVO ]";
            return;
        }

        // Se não tem, cria a sessão ativa agora
        await sessaoRef.set({ 
            inicio: firebase.firestore.FieldValue.serverTimestamp() 
        });

    } catch (err) {
        // Se der erro na checagem de sessão, prossegue por segurança
    }

    // 5. Checa o plano no Firestore
    try {
        loadingSteps.innerHTML = "[ Carregando painel do usuário... ]";
        const docRef = await db.collection("usuarios").doc(usuarioUid).get();

        if (docRef.exists) {
            const dados = docRef.data();
            const planoUsuario = dados.plano ? dados.plano.trim().toLowerCase() : "basico";

            loadingSteps.style.color = "#00ff64"; // Verde sucesso
            loadingSteps.innerHTML = "[ ✔ ACESSO LIBERADO! ]";

            setTimeout(() => {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('selectionSection').style.display = 'block';
                
                const linkRede1 = document.getElementById('linkRede1');
                const linkRede2 = document.getElementById('linkRede2');

                if (planoUsuario === 'completo') {
                    if (linkRede1) linkRede1.style.display = 'block';
                    if (linkRede2) linkRede2.style.display = 'block';
                } else {
                    if (linkRede1) linkRede1.style.display = 'none';
                    if (linkRede2) linkRede2.style.display = 'block';
                }
            }, 1000);

        } else {
            submitBtn.disabled = false;
            submitBtn.style.opacity = '1';
            loadingSteps.style.color = '#ff3333';
            loadingSteps.innerHTML = "[ ❌ ERRO: Usuário sem plano ]";
        }

    } catch (e) {
        submitBtn.disabled = false;
        submitBtn.style.opacity = '1';
        loadingSteps.style.color = '#ff3333';
        loadingSteps.innerHTML = "[ ❌ Erro de comunicação com o banco ]";
    }
}

        let inactivityTimer = null;
        const TEMPO_LIMITE = 10 * 60 * 1000;

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                inactivityTimer = setTimeout(() => {
                    if (heartbeatInterval) clearInterval(heartbeatInterval);
                    const user = auth.currentUser;
                    if (user) {
                        db.collection("sessoes_ativas").doc(user.uid).delete();
                    }
                    auth.signOut().then(() => {
                        location.reload();
                        const errorMsg = document.getElementById('errorMsg');
                        errorMsg.innerText = "Você foi deslogado por inatividade, logue novamente quando for assistir.";
                        errorMsg.style.display = 'block';
                    });
                }, TEMPO_LIMITE);
            } else {
                if (inactivityTimer) {
                    clearTimeout(inactivityTimer);
                    inactivityTimer = null;
                }
            }
        });
    </script>
</body>
</html>
