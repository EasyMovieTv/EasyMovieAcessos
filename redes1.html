<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Movies - Acesso Liberado</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; -webkit-user-select: none; }
        body { background-color: #050505; background: linear-gradient(135deg, #050505 0%, #1a0000 50%, #050505 100%); height: 100vh; display: flex; justify-content: center; align-items: center; color: #ffffff; overflow: hidden; }
        .box { background: rgba(15, 15, 15, 0.85); padding: 40px; border-radius: 12px; box-shadow: 0 8px 32px rgba(255, 0, 0, 0.2); border: 1px solid rgba(255, 0, 0, 0.3); width: 100%; max-width: 420px; text-align: center; backdrop-filter: blur(10px); }
        .logo { font-size: 28px; font-weight: 900; margin-bottom: 25px; font-family: 'Arial Black', Gadget, sans-serif; text-transform: uppercase; }
        h1 { font-size: 18px; color: #00ff64; margin-bottom: 15px; }
        p { color: #aaa; font-size: 14px; margin-bottom: 25px; line-height: 1.5; }
        .btn { display: block; width: 100%; padding: 14px; background: #E50914; color: white; border: none; border-radius: 6px; font-weight: bold; text-decoration: none; font-size: 16px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 14px rgba(229, 9, 20, 0.4); }
        .btn:hover { background: #f40612; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="box">
        <div class="logo">EASY<span style="color:#ff3333;">MOVIES</span></div>
        <h1>✔ ACESSO AUTORIZADO</h1>
        <p>Sua autenticação foi confirmada com segurança. Clique no botão abaixo para abrir a <strong>Rede 1</strong>.</p>
        <a href="https://www3.redecanais.vip/" class="btn" target="_blank">ACESSAR REDE 1 AGORA</a>
    </div>

    <script>
        // Proteções contra inspeção e cópia
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.key === 'F12' || (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.key === 'i' || e.key === 'I' || e.key === 'c' || e.key === 'C'))) {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
